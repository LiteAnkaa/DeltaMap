<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1420"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>DeltaMap — онлайн-мапа тривог</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0b1420;--text:#f4f8fc;--muted:#a7b7c7;--accent:#54dfc5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b1420;color:var(--text);font-family:Arial,system-ui,sans-serif}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 15% 0%,#17364a 0%,transparent 42%),#0b1420}
header{height:62px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(110deg,#142536,#1b3042 55%,#142536);border-bottom:1px solid #345064;padding-top:env(safe-area-inset-top);box-shadow:0 5px 22px #0004;z-index:2}
h1{font-size:22px;font-weight:750;letter-spacing:1.2px;margin:0;background:linear-gradient(90deg,#f7fbff,#7ce6d2);-webkit-background-clip:text;background-clip:text;color:transparent}
main{position:relative;flex:1;min-height:0;overflow:hidden}#map{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#1b3448 0%,#101c2a 72%)}
.leaflet-container{background:transparent;font:12px system-ui}.leaflet-tooltip.region-label{background:#102231ef;border:1px solid #6b9aa2;color:#f4fbff;border-radius:5px;padding:2px 4px;box-shadow:0 2px 8px #0008;font-size:8px;font-weight:700;white-space:nowrap}.leaflet-tooltip.region-label:before{display:none}.leaflet-control-zoom{display:none}.leaflet-control-attribution{background:#111820d9!important;color:#91a0ad!important;font-size:8px!important}.leaflet-control-attribution a{color:#75cbbb!important}
.map-status{position:absolute;z-index:500;left:12px;bottom:12px;background:#111820e8;border:1px solid #34495a;border-radius:8px;padding:8px 10px;font-size:11px;color:#aab7c2;pointer-events:none;line-height:1.45}.map-status b{color:#edf4f8}
.admin{position:absolute;z-index:1000;top:0;right:0;bottom:0;width:min(340px,88vw);max-height:100%;overflow:auto;background:linear-gradient(180deg,#122536f7,#0c1926f7);border-left:1px solid #527084;border-radius:0;padding:18px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:-12px 0 34px #0008;display:none}.admin.open{display:block}.admin h2{font-size:17px;padding-bottom:10px;border-bottom:1px solid #365064}.admin.open~.map-status{left:10px;right:10px;max-width:calc(100% - 360px)}@media(max-width:600px){.admin{width:min(310px,86vw)}.admin.open~.map-status{max-width:calc(100% - 20px);bottom:10px}}.admin h2{font-size:16px;margin:0 0 10px}.admin select,.admin input,.admin button{width:100%;padding:10px;border-radius:8px;border:1px solid #486174;background:#172b3c;color:#f4f8fc;margin:4px 0;font-size:13px}.admin .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.admin button{cursor:pointer;font-weight:700}.admin button.red{background:#8e302e}.admin button.yellow{background:#8c711c}.admin button.purple{background:#593b86}.admin button.green{background:#23634a}.admin button.orange{background:#875022}.admin button.clear{background:#344454}.admin small{color:#a9bac8;line-height:1.4}
footer{flex:none;min-height:48px;display:flex;align-items:center;justify-content:center;background:linear-gradient(100deg,#182838,#213448,#182838);border-top:1px solid #3a5267;padding:8px 12px calc(8px + env(safe-area-inset-bottom));font-size:13px}
footer a{color:#7ce6d2;text-decoration:none;font-weight:600}footer a:active{opacity:.7}
</style></head><body>
<header><h1>DeltaMap</h1></header>
<main><div id="map"></div><section id="adminPanel" class="admin"><h2>DeltaMap · керування</h2><input id="adminPass" type="password" placeholder="Пароль адміністратора"><select id="regionSelect"><option value="*">Уся Україна</option></select><div class="actions"><button class="red" data-level="red">Червоний рівень</button><button class="yellow" data-level="yellow">Жовтий рівень</button><button class="purple" data-level="radiation">Радіаційна загроза</button><button class="green" data-level="chemical">Хімічна загроза</button><button class="orange" data-level="clashes">Повідомлення про зіткнення</button><button class="clear" data-level="clear">Скасувати статус</button></div><small>Це інформаційні позначки DeltaMap, не офіційні сигнали тривоги. Публікуйте лише перевірену інформацію.</small><p id="adminMsg"></p></section><div class="map-status"><b>DeltaMap · Україна</b><br><span id="mapStatus">Завантаження карти…</span></div></main>
<footer><a href="mailto:contact@deltamap.example">Зв’язок із командою</a></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false,minZoom:5,maxZoom:10,zoomSnap:.25}).setView([48.7,31.3],5.4);
const GEO='https://cdn.jsdelivr.net/gh/darmat1/ukraine-geo-data@main/geodata/Ukraine.geojson';
const names=['Вінницька область','Волинська область','Дніпропетровська область','Донецька область','Житомирська область','Закарпатська область','Запорізька область','Івано-Франківська область','Київська область','Кіровоградська область','Луганська область','Львівська область','Миколаївська область','Одеська область','Полтавська область','Рівненська область','Сумська область','Тернопільська область','Харківська область','Херсонська область','Хмельницька область','Черкаська область','Чернівецька область','Чернігівська область','АР Крим','м. Київ','м. Севастополь'];
const aliases={'Vinnytska':'Вінницька область','Volynska':'Волинська область','Dnipropetrovska':'Дніпропетровська область','Donetska':'Донецька область','Zhytomyrska':'Житомирська область','Zakarpatska':'Закарпатська область','Zaporizka':'Запорізька область','Ivano-Frankivska':'Івано-Франківська область','Kyivska':'Київська область','Kirovohradska':'Кіровоградська область','Luhanska':'Луганська область','Lvivska':'Львівська область','Mykolaivska':'Миколаївська область','Odeska':'Одеська область','Poltavska':'Полтавська область','Rivnenska':'Рівненська область','Sumska':'Сумська область','Ternopilska':'Тернопільська область','Kharkivska':'Харківська область','Khersonska':'Херсонська область','Khmelnytska':'Хмельницька область','Cherkaska':'Черкаська область','Chernivetska':'Чернівецька область','Chernihivska':'Чернігівська область','Crimea':'АР Крим','Autonomous Republic of Crimea':'АР Крим','Sevastopol':'м. Севастополь','Kyiv':'м. Київ'};
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/область|oblast|region|місто|city/g,'').replace(/[^a-zа-яіїє0-9]/gi,'')}
function regionName(f){for(const v of Object.values(f.properties||{})){if(typeof v!=='string')continue;for(const [k,n] of Object.entries(aliases)){if(norm(v)===norm(k)||norm(v)===norm(n)||norm(v).includes(norm(k)))return n;}}return 'Україна'}
const status=new Map();let geo=null;const adminOpen=new URLSearchParams(location.search).get('admin')==='1';
const levelColors={red:'#c64a45',yellow:'#e3bd36',radiation:'#9563c9',chemical:'#3b9b73',clashes:'#d17b38'};
function fill(n){const v=status.get(n);return levelColors[v]||'#344352'}
function style(f){return{color:'#17232e',weight:1.1,fillColor:fill(regionName(f)),fillOpacity:1}}
function updateStyles(){if(geo)geo.setStyle(style)}
async function loadGeo(){try{const r=await fetch(GEO);if(!r.ok)throw Error();const data=await r.json();geo=L.geoJSON(data,{style,onEachFeature:(f,l)=>{const label=regionName(f);l.bindTooltip(label,{permanent:true,direction:'center',className:'region-label',opacity:1});}}).addTo(map);map.fitBounds(geo.getBounds(),{padding:[12,12]});document.getElementById('mapStatus').textContent='Карта України · підписані області';}catch(e){document.getElementById('mapStatus').textContent='Не вдалося завантажити карту';}}
async function refreshAlerts(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('Сервер повернув не JSON');const d=await r.json();status.clear();Object.entries(d.statuses||{}).forEach(([n,v])=>{if(levelColors[v])status.set(n,v)});updateStyles();const active=status.size;document.getElementById('mapStatus').textContent=active?`Інформаційні позначки DeltaMap: ${active} · ${new Date().toLocaleTimeString('uk-UA')}`:'Немає опублікованих позначок DeltaMap';}catch(e){document.getElementById('mapStatus').textContent='Статуси сервера поки недоступні';}}
const panel=document.getElementById('adminPanel');if(adminOpen)panel.classList.add('open');
names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;document.getElementById('regionSelect').appendChild(o)});
async function publish(level){const pass=document.getElementById('adminPass').value;const region=document.getElementById('regionSelect').value;const changes={};if(region==='*'){names.forEach(n=>{changes[n]=level==='clear'?null:level;});}else changes[region]=level==='clear'?null:level;try{if(!pass){document.getElementById('adminMsg').textContent='Введіть пароль адміністратора';return;}const r=await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':pass},body:JSON.stringify({changes})});const ct=r.headers.get('content-type')||'';const d=ct.includes('application/json')?await r.json():{};if(!r.ok)throw Error(d.error||('Помилка сервера: HTTP '+r.status));document.getElementById('adminMsg').textContent='Опубліковано для всіх відвідувачів';await refreshAlerts();}catch(e){document.getElementById('adminMsg').textContent='Не вдалося зберегти: '+e.message;}}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>publish(b.dataset.level)));
loadGeo();refreshAlerts();setInterval(refreshAlerts,5000);

if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
